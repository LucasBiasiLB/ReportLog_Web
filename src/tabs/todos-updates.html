<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportLog | Todas as atualizações</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <!-- Ícones usados na página. Cada um é chamado depois com <use href="#nome"> -->
    <svg width="0" height="0" aria-hidden="true">
        <symbol id="i-direita" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
        <symbol id="i-coracao" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
        <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
        <symbol id="i-sugestoes" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="i-usuario" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>

        <symbol id="i-sair" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
        <symbol id="i-seta" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
        <symbol id="i-ideia" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></symbol>
        <symbol id="i-coracao" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
        <symbol id="i-lixo" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
        <symbol id="i-mais" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
        <symbol id="i-enviar" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
        <symbol id="i-imagem" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
        <symbol id="i-fechar" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
        <symbol id="i-estrela" viewBox="0 0 24 24"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/></symbol>
        <symbol id="i-documento" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
        <symbol id="i-cubo" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
    </svg>

    <div class="pagina">

        <!-- ========== MENU LATERAL ========== -->
        <aside class="menu-lateral" id="menu-lateral">

            <div class="marca">
                <img src="../../assets/image/logo.png" alt="" class="marca-logo">
                <p class="marca-nome">ReportLog</p>
            </div>

            <hr class="linha">

            <!-- Para a página atual usamos a classe "ativo" -->
            <nav class="menu-links">
                <a href="index.html" class="menu-link ativo">
                    <svg class="icone"><use href="#i-inicio"/></svg> Início
                </a>
                <a href="sugestoes.html" class="menu-link">
                    <svg class="icone"><use href="#i-ideia"/></svg> Sugestões
                </a>
                <a href="usuario.html" class="menu-link">
                    <svg class="icone"><use href="#i-usuario"/></svg> Usuário
                </a>
                <a href="sobre-nos.html" class="menu-link">
                    <svg class="icone"><use href="#i-info"/></svg> Sobre nós
                </a>
            </nav>

            <!-- Parte de baixo do menu -->
            <div class="menu-rodape">

                <button type="button" class="botao-sair">
                    <svg class="icone"><use href="#i-sair"/></svg> Sair
                </button>

                <p class="versao">v1.0.0</p>
            </div>
        </aside>

        <!-- ========== CONTEÚDO ========== -->
        <div class="conteudo">

            <!-- Barra do topo -->
            <header class="topo">
                <!-- Botão que só aparece em telas pequenas, para abrir o menu -->
                <button type="button" class="botao-menu" id="botao-menu" aria-label="Abrir menu" aria-expanded="false">
                    <svg class="icone"><use href="#i-menu"/></svg>
                </button>

                <p class="topo-frase">Jogue | Evolua | Conquiste.</p>


            </header>

            <main class="principal">

                <a href="index.html" class="link-pequeno link-voltar">
                    <svg class="icone"><use href="#i-direita"/></svg> Voltar ao início
                </a>

                <section class="cabecalho-pagina cabecalho-com-voltar">
                    <div>
                        <h1 class="titulo-pagina">Todas as atualizações</h1>
                        <p class="subtitulo-pagina">Veja tudo que já foi lançado no ReportLog.</p>
                    </div>
                    <span class="contador" id="contador">0 publicadas</span>
                </section>

                <!-- Os updates são desenhados aqui pelo pagina-todos-updates.js -->
                <div class="update-lista" id="lista-updates"></div>
            </main>
        </div>
    </div>

    <!-- ========== JANELA: VER UPDATE ==========
         Quem preenche é o janelas-update.js (função abrirVerUpdate) -->
    <dialog class="janela" id="janela-ver-update" aria-labelledby="ver-titulo">
        <div class="janela-caixa">

            <header class="janela-topo">
                <svg class="icone"><use href="#i-documento"/></svg>
                <h2>Visualizar update</h2>
                <button type="button" class="janela-fechar" data-fechar aria-label="Fechar">
                    <svg class="icone"><use href="#i-fechar"/></svg>
                </button>
            </header>

            <div class="janela-corpo">

                <!-- Banner com a versão por cima -->
                <div class="ver-banner" id="ver-bloco-imagem">
                    <img id="ver-imagem" src="" alt="">
                    <span class="ver-selo" id="ver-versao"></span>
                </div>

                <!-- Data, título e descrição curta -->
                <div>
                    <p class="ver-meta">
                        <span><svg class="icone"><use href="#i-calendario"/></svg> <time id="ver-data"></time></span>
                        <span><svg class="icone"><use href="#i-cubo"/></svg> Versão <b id="ver-versao-texto"></b></span>
                    </p>
                    <h3 class="ver-titulo" id="ver-titulo"></h3>
                    <p class="ver-descricao" id="ver-descricao"></p>
                </div>

                <!-- Novidades: um card para cada (CartaoNovidade, em cartoes.js) -->
                <section id="ver-bloco-novidades">
                    <h4 class="janela-secao"><svg class="icone"><use href="#i-estrela"/></svg> Novidades</h4>
                    <div class="novidades" id="ver-novidades"></div>
                </section>

                <!-- Texto detalhado -->
                <section id="ver-bloco-detalhes">
                    <h4 class="janela-secao"><svg class="icone"><use href="#i-documento"/></svg> Detalhes</h4>
                    <div class="detalhes" id="ver-detalhes"></div>
                </section>
            </div>
        </div>
    </dialog>

    <script src="../../assets/js/cache.js"></script>
    <script src="../../assets/js/sessao.js"></script>
    <script src="../../assets/js/scripts.js"></script>
    <script src="../../assets/js/icons.js"></script>
    <script src="../../assets/js/util.js"></script>
    <script src="../../assets/js/cartoes.js"></script>

    <script src="../../assets/js/janelas-update.js"></script>
    <script type="module" src="../../assets/js/pagina-todos-updates.js"></script>
</body>
</html>

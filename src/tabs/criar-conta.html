<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportLog | Criar conta</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="icon" type="image/png" href="../../assets/icons/logo.png">
</head>
<body class="auth">

    <div class="auth-pagina">

        <header class="auth-topo">
            <div class="auth-marca">
                <img src="../../assets/image/logo.png" alt="" class="marca-logo">
                <p class="marca-nome">ReportLog</p>
                <p class="auth-frase">Jogue | Evolua | Conquiste.</p>
            </div>
            <a href="#" class="auth-portal">PORTAL DO JOGO</a>
        </header>

        <!-- ========== formulário no centro ========== -->
        <main class="auth-principal">
            <h1 class="auth-titulo">Novo Aqui?</h1>
            <p class="auth-subtitulo">Entre para a comunidade do Reportlog!</p>

            <form class="auth-form" id="form-criar-conta" action="criar-conta" method="post">

                <label class="auth-campo">
                    <span>Nome de usuário</span>
                    <input type="text" name="usuario" placeholder="Como você quer ser chamado?" autocomplete="username">
                </label>

                <label class="auth-campo">
                    <span>E-mail</span>
                    <input type="email" name="email" placeholder="voce@exemplo.com" autocomplete="email">
                </label>

                <label class="auth-campo">
                    <span>Senha</span>
                    <input type="password" name="senha" placeholder="Crie uma senha" autocomplete="new-password">
                </label>

                <label class="auth-campo">
                    <span>Confirmar senha</span>
                    <input type="password" name="confirmar" placeholder="Digite sua senha novamente" autocomplete="new-password">
                </label>

                <label class="auth-termos">
                    <input type="checkbox" name="termos">
                    <span>Concordo com os Termos de uso e a Política de privacidade.</span>
                </label>

                <button type="submit" class="botao botao-largo auth-entrar">Criar conta</button>

                <p class="auth-troca">Já tem uma conta? <a href="login.html">Entrar</a></p>
            </form>
        </main>

        <footer class="auth-rodape">Reportlog · Jogo de vôlei em pixel art</footer>
    </div>

    <script src="../../assets/js/cache.js"></script>
    <script src="../../assets/js/sessao.js"></script>
    <script src="../../assets/js/pagina-login.js"></script>
</body>
</html>

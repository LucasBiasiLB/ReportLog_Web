<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportLog | Login</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="auth">

    <div class="auth-pagina">

        <header class="auth-topo">
            <div class="auth-marca">
                <img src="../../assets/image/logo.png" alt="" class="marca-logo">
                <p class="marca-nome">ReportLog</p>
                <p class="auth-frase">Jogue | Evolua | Conquiste.</p>
            </div>
            <a href="#" class="auth-portal">PORTAL DO JOGO</a>
        </header>

        <!-- ========== CONTEÚDO: formulário no centro ========== -->
        <main class="auth-principal">
            <h1 class="auth-titulo">LOGIN</h1>
            <p class="auth-subtitulo">Entre para acompanhar os updates do Reportlog.</p>

            <form class="auth-form" id="form-login">

                <label class="auth-campo">
                    <span>E-mail</span>
                    <input type="email" name="email" placeholder="Email" autocomplete="email">
                </label>

                <label class="auth-campo">
                    <span>Senha</span>
                    <input type="password" name="senha" placeholder="Senha" autocomplete="current-password">
                </label>

                <button type="submit" class="botao botao-largo auth-entrar">Entrar</button>

                <a href="#" class="auth-link-centro">Esqueci minha senha</a>

                <a href="criar-conta.html" class="botao-contorno">Criar conta</a>
            </form>
        </main>

        <footer class="auth-rodape">Reportlog · Jogo de vôlei em pixel art</footer>
    </div>


    <script src="../../assets/js/sessao.js"></script>
    <script src="../../assets/js/pagina-login.js"></script>
</body>
</html>

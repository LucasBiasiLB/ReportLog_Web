<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportLog | Usuário</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <!-- Ícones usados na página. Cada um é chamado depois com <use href="#nome"> -->
    <svg width="0" height="0" aria-hidden="true">
        <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
        <symbol id="i-sugestoes" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="i-usuario" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
        <symbol id="i-sino" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
        <symbol id="i-sair" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
        <symbol id="i-seta" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
        <symbol id="i-direita" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
        <symbol id="i-editar" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
        <symbol id="i-ideia" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></symbol>
        <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
        <symbol id="i-filtro" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></symbol>
        <symbol id="i-mais" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
        <symbol id="i-enviar" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
        <symbol id="i-lixo" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
        <symbol id="i-coracao" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></symbol>
        <symbol id="i-imagem" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    </svg>

    <div class="pagina">

        <!-- ========== MENU LATERAL ========== -->
        <aside class="menu-lateral" id="menu-lateral">

            <div class="marca">
                <img src="../../assets/image/logo.png" alt="" class="marca-logo">
                <p class="marca-nome">ReportLog</p>
            </div>

            <hr class="linha">

            <nav class="menu-links">
                <a href="index.html" class="menu-link">
                    <svg class="icone"><use href="#i-inicio"/></svg> Início
                </a>
                <a href="sugestoes.html" class="menu-link">
                    <svg class="icone"><use href="#i-ideia"/></svg> Sugestões
                </a>
                <a href="usuario.html" class="menu-link ativo">
                    <svg class="icone"><use href="#i-usuario"/></svg> Usuário
                </a>
                <a href="sobre-nos.html" class="menu-link">
                    <svg class="icone"><use href="#i-info"/></svg> Sobre nós
                </a>
            </nav>

            <!-- Parte de baixo do menu -->
            <div class="menu-rodape">
                <button type="button" class="botao-sair">
                    <svg class="icone"><use href="#i-sair"/></svg> Sair
                </button>
                <p class="versao">v0.0.1</p>
            </div>
        </aside>

        <!-- ========== CONTEÚDO ========== -->
        <div class="conteudo">

            <!-- Barra do topo (sem o usuário no canto direito) -->
            <header class="topo">
                <button type="button" class="botao-menu" id="botao-menu" aria-label="Abrir menu" aria-expanded="false">
                    <svg class="icone"><use href="#i-menu"/></svg>
                </button>

                <p class="topo-frase">Seu perfil</p>

                <div class="topo-direita">
                    <button type="button" class="botao-sino" aria-label="Notificações">
                        <svg class="icone"><use href="#i-sino"/></svg>
                    </button>
                </div>
            </header>

            <main class="principal">

                <!-- Banner + foto de perfil -->
                <section class="perfil-capa">
                    <img src="../../assets/image/banner.png" alt="" class="perfil-banner">
                    <img src="../../assets/image/avatar.png" alt="" class="perfil-avatar">
                </section>

                <!-- Nome e bio -->
                <div class="perfil-info">
                    <h1 class="perfil-nome">Nome do usuário</h1>
                    <p class="perfil-bio">Bio do usuário</p>
                </div>

                <!-- Ações -->
                <nav class="perfil-acoes">
                    <a href="editar-perfil.html" class="acao">
                        <span class="acao-icone"><svg class="icone"><use href="#i-editar"/></svg></span>
                        <span class="acao-texto">
                            <strong>Editar</strong>
                            <small>Altere suas informações</small>
                        </span>
                        <svg class="icone acao-seta"><use href="#i-direita"/></svg>
                    </a>

                    <a href="minhas-sugestoes.html" class="acao">
                        <span class="acao-icone"><svg class="icone"><use href="#i-ideia"/></svg></span>
                        <span class="acao-texto">
                            <strong>Sugestões</strong>
                            <small>Veja suas sugestões</small>
                        </span>
                        <svg class="icone acao-seta"><use href="#i-direita"/></svg>
                    </a>

                    <button type="button" class="acao acao-perigo">
                        <span class="acao-icone"><svg class="icone"><use href="#i-sair"/></svg></span>
                        <span class="acao-texto">
                            <strong>Sair</strong>
                            <small>Encerrar sessão</small>
                        </span>
                        <svg class="icone acao-seta"><use href="#i-direita"/></svg>
                    </button>
                </nav>
            </main>

            <footer class="rodape">ReportLog • IFPR 2026</footer>
        </div>
    </div>

    <script src="../../assets/js/cache.js"></script>
    <script src="../../assets/js/sessao.js"></script>
    <script src="../../assets/js/scripts.js"></script>
    <script src="../../assets/js/util.js"></script>
    <script src="../../assets/js/notificacoes.js"></script>
    <script type="module" src="../../assets/js/pagina-usuario.js"></script>
</body>
</html>

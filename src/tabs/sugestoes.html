<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportLog | Sugestões</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <!-- Ícones usados na página. Cada um é chamado depois com <use href="#nome"> -->
    <svg width="0" height="0" aria-hidden="true">
        <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
        <symbol id="i-sugestoes" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="i-usuario" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
        <symbol id="i-sino" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
        <symbol id="i-sair" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
        <symbol id="i-seta" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
        <symbol id="i-direita" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
        <symbol id="i-editar" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
        <symbol id="i-ideia" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></symbol>
        <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
        <symbol id="i-filtro" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></symbol>
        <symbol id="i-mais" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
        <symbol id="i-enviar" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
        <symbol id="i-lixo" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
        <symbol id="i-coracao" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></symbol>
        <symbol id="i-imagem" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    </svg>

    <div class="pagina">

        <!-- ========== MENU LATERAL ========== -->
        <aside class="menu-lateral" id="menu-lateral">

            <div class="marca">
                <img src="../../assets/image/logo.png" alt="" class="marca-logo">
                <p class="marca-nome">ReportLog</p>
            </div>

            <hr class="linha">

            <nav class="menu-links">
                <a href="index.html" class="menu-link">
                    <svg class="icone"><use href="#i-inicio"/></svg> Início
                </a>
                <a href="sugestoes.html" class="menu-link ativo">
                    <svg class="icone"><use href="#i-ideia"/></svg> Sugestões
                </a>
                <a href="usuario.html" class="menu-link">
                    <svg class="icone"><use href="#i-usuario"/></svg> Usuário
                </a>
                <a href="sobre-nos.html" class="menu-link">
                    <svg class="icone"><use href="#i-info"/></svg> Sobre nós
                </a>
            </nav>

            <!-- Parte de baixo do menu (sem o card de usuário) -->
            <div class="menu-rodape">
                <button type="button" class="botao-sair">
                    <svg class="icone"><use href="#i-sair"/></svg> Sair
                </button>
                <p class="versao">v0.0.1</p>
            </div>
        </aside>

        <!-- ========== CONTEÚDO ========== -->
        <div class="conteudo">

            <!-- Barra do topo (sem o usuário no canto direito) -->
            <header class="topo">
                <button type="button" class="botao-menu" id="botao-menu" aria-label="Abrir menu" aria-expanded="false">
                    <svg class="icone"><use href="#i-menu"/></svg>
                </button>

                <p class="topo-frase">Veja as sugestões da galera</p>

                <div class="topo-direita">
                    <button type="button" class="botao-sino" aria-label="Notificações">
                        <svg class="icone"><use href="#i-sino"/></svg>
                    </button>
                </div>
            </header>

            <main class="principal">

                <!-- Cabeçalho: título + busca + filtros -->
                <section class="cabecalho-pagina">
                    <div>
                        <h1 class="titulo-pagina">Sugestões</h1>
                        <p class="subtitulo-pagina">Compartilhe ideias!</p>
                    </div>

                    <div class="cabecalho-ferramentas">
                        <label class="campo-busca">
                            <svg class="icone"><use href="#i-busca"/></svg>
                            <input type="search" placeholder="Buscar sugestões...">
                        </label>

                        <button type="button" class="botao-filtros" id="botao-filtros" aria-expanded="false" aria-controls="painel-filtros">
                            <svg class="icone"><use href="#i-filtro"/></svg> Filtros
                            <span class="filtros-contagem" id="filtros-contagem" hidden>0</span>
                        </button>

                        <div class="filtros-ancora">
                            <div class="painel-filtros" id="painel-filtros" role="dialog" aria-label="Filtros" hidden>
                                <div class="painel-filtros-content">
                                    <fieldset class="filtro-grupo">
                                        <legend>Ordenar por</legend>
                                        <label class="filtro-opcao"><input type="radio" name="filtro-ordem" value="recentes" checked><span>Recentes</span></label>
                                        <label class="filtro-opcao"><input type="radio" name="filtro-ordem" value="curtidas"><span>Mais curtidas</span></label>
                                    </fieldset>

                                    <fieldset class="filtro-grupo">
                                        <legend>Categorias</legend>
                                        <label class="filtro-opcao"><input type="checkbox" name="filtro-categoria" value="jogabilidade"><span>Jogabilidade</span></label>
                                        <label class="filtro-opcao"><input type="checkbox" name="filtro-categoria" value="personagens"><span>Personagens</span></label>
                                        <label class="filtro-opcao"><input type="checkbox" name="filtro-categoria" value="interface"><span>Interface</span></label>
                                        <label class="filtro-opcao"><input type="checkbox" name="filtro-categoria" value="graficos"><span>Gráficos</span></label>
                                        <label class="filtro-opcao"><input type="checkbox" name="filtro-categoria" value="outros"><span>Outros</span></label>
                                    </fieldset>
                                </div>
                                <button type="button" class="filtros-limpar" id="filtros-limpar">Limpar filtros</button>
                            </div>
                        </div>

                    </div>

                </section>

                <div class="sugestoes-grade">

                    <!-- ===== COLUNA ESQUERDA: lista ===== -->
                    <section class="sugestoes-lista">
                        <div class="secao-topo">
                            <h2 class="secao-titulo">Ideias dos jogadores</h2>
                            <span class="contador" id="contador">0 publicações</span>
                        </div>

                        <!-- Os cards das sugestões são desenhados aqui pelo JS -->
                        <div class="sugestoes-itens" id="lista-sugestoes"></div>

                    </section>

                    <!-- ===== COLUNA DIREITA: formulário ===== -->
                    <aside class="sugestoes-form">
                        <form class="formulario" id="form-sugestao" action="#" method="post">
                            <div class="formulario-topo">
                                <svg class="icone"><use href="#i-mais"/></svg>
                                <div>
                                    <h2>Nova sugestão</h2>
                                    <p>Conte sua ideia para ajudar a melhorar o jogo.</p>
                                </div>
                            </div>

                            <label class="campo">
                                <span>Título da sugestão</span>
                                <input type="text" name="titulo" maxlength="50" placeholder="Ex: Adicionar novos personagens">
                                <small>0/50</small>
                            </label>

                            <label class="campo">
                                <span>Descrição da ideia</span>
                                <textarea name="descricao" maxlength="500" rows="4" placeholder="Explique como sua ideia funcionaria e por que ela seria interessante..."></textarea>
                                <small>0/500</small>
                            </label>

                            <fieldset class="campo">
                                <legend>Categoria da sugestão</legend>
                                <div class="opcoes">
                                    <label class="opcao"><input type="radio" name="categoria" value="jogabilidade" checked><span>Jogabilidade</span></label>
                                    <label class="opcao"><input type="radio" name="categoria" value="personagens"><span>Personagens</span></label>
                                    <label class="opcao"><input type="radio" name="categoria" value="interface"><span>Interface</span></label>
                                    <label class="opcao"><input type="radio" name="categoria" value="graficos"><span>Gráficos</span></label>
                                    <label class="opcao"><input type="radio" name="categoria" value="outros"><span>Outros</span></label>
                                </div>
                            </fieldset>

                            <fieldset class="campo">
                                <legend>Escolher ícone</legend>
                                <div class="icones-escolha">
                                    <!-- 5 opções de ícone; os nomes são salvos no banco (atck, def...) -->
                                    <label class="icone-opcao"><input type="radio" name="icone" value="1" checked><span><img src="/ReportLog_Web/assets/icons/atck.png" alt="atck"></span></label>
                                    <label class="icone-opcao"><input type="radio" name="icone" value="2"><span><img src="/ReportLog_Web/assets/icons/def.png" alt="def"></span></label>
                                    <label class="icone-opcao"><input type="radio" name="icone" value="3"><span><img src="/ReportLog_Web/assets/icons/mov.png" alt="mov"></span></label>
                                    <label class="icone-opcao"><input type="radio" name="icone" value="4"><span><img src="/ReportLog_Web/assets/icons/mp.png" alt="mp"></span></label>
                                    <label class="icone-opcao"><input type="radio" name="icone" value="5"><span><img src="/ReportLog_Web/assets/icons/set.png" alt="set"></span></label>
                                </div>
                            </fieldset>

                            <button type="submit" class="botao botao-largo">
                                <svg class="icone"><use href="#i-enviar"/></svg> Publicar sugestão
                            </button>
                        </form>
                    </aside>
                </div>
            </main>

            <footer class="rodape">ReportLog • IFPR 2026</footer>
        </div>
    </div>

    <script src="../../assets/js/cache.js"></script>
    <script src="../../assets/js/sessao.js"></script>
    <script src="../../assets/js/scripts.js"></script>
    <script src="../../assets/js/icons.js"></script>
    <script src="../../assets/js/util.js"></script>
    <script src="../../assets/js/cartoes.js"></script>
    <script src="../../assets/js/notificacoes.js"></script>
    <script type="module" src="../../assets/js/pagina-sugestoes.js"></script>

</body>
</html>
